# Infrastructure services for all pydanticai-fluent examples.
# Start all:    docker compose up -d
# Start one:    docker compose up -d mongo
# Stop one:     docker compose stop mongo            (keeps data)
# Remove one (container only):
#               docker compose rm -f mongo
# Remove one + its volumes:
#               docker compose rm -f mongo
#               docker volume rm agent-harness_mongo_data agent-harness_mongo_configdb
# Stop all:     docker compose down -v

name: agent-harness

services:
  mongo:
    image: mongo:7
    container_name: agent-harness-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: agent_memory
    volumes:
      - mongo_data:/data/db
      - mongo_configdb:/data/configdb

  mongo-express:
    image: mongo-express:latest
    container_name: agent-harness-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agent-harness-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  elasticsearch:
    image: elasticsearch:9.5.1
    container_name: agent-harness-elastic
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: kibana:9.5.1
    container_name: agent-harness-kibana
    ports:
      - "5601:5601"
    environment:
      SERVER_HOST: "0.0.0.0"
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      xpack.security.enabled: "false"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.5.1
    container_name: agent-harness-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - elasticsearch
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: agent-harness-jaeger
    ports:
      - "16686:16686"   # UI
      - "14317:4317"     # OTLP gRPC
      - "14318:4318"     # OTLP HTTP
    volumes:
      - jaeger_data:/tmp   # badger storage dir (image declares VOLUME /tmp)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.0
    container_name: agent-harness-otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC (standard OTLP port)
      - "4318:4318"   # OTLP HTTP (standard OTLP port)
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - elasticsearch
      - prometheus
      - jaeger

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: agent-harness-pushgateway
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: agent-harness-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-otlp-receiver"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: agent-harness-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_configdb:
  redis_data:
  es_data:
  jaeger_data:
  prometheus_data:
  rabbitmq_data:
