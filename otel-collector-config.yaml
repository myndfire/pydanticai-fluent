receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Keep the Elasticsearch log stream high-signal: drop lifecycle "started"
  # markers and retry backoff waits (the completion record and retry_attempt
  # already carry the useful information), plus any DEBUG records.
  # The harness mirrors this by emitting these at DEBUG, but the filter is a
  # policy net for any app that emits them at INFO.
  filter/drop_noise:
    error_mode: ignore
    logs:
      log_record:
        - severity_number == SEVERITY_NUMBER_DEBUG
        - IsMatch(body.string, ".*_started$")
        - body.string == "retry_wait"
  # The harness does not even configure a metrics exporter at the minimal
  # granularity; this is a safety net for any app that still emits metrics.
  filter/drop_minimal_metrics:
    error_mode: ignore
    metrics:
      metric:
        - resource.attributes["harness.telemetry.level"] == "minimal"
  batch:

exporters:
  otlp_http/langfuse:
    endpoint: ${env:LANGFUSE_HOST}/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH}"
      x-langfuse-ingestion-version: "4"
  otlp_http/elasticsearch:
    endpoint: http://elasticsearch:9200/_otlp
  # OpenObserve ingests all three signals over OTLP/HTTP. The endpoint must not
  # have a trailing slash (the collector appends /v1/{signal}).
  otlp_http/openobserve:
    endpoint: ${env:OPENOBSERVE_ENDPOINT}
    headers:
      Authorization: "Basic ${env:OPENOBSERVE_AUTH}"
      stream-name: agent-harness
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/langfuse, otlp_http/openobserve]
    metrics:
      receivers: [otlp]
      processors: [filter/drop_minimal_metrics, batch]
      exporters: [otlp_http/elasticsearch, otlp_http/openobserve]
    logs:
      receivers: [otlp]
      processors: [filter/drop_noise, batch]
      exporters: [otlp_http/elasticsearch, otlp_http/openobserve]
