receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Keep the Elasticsearch log stream high-signal: drop lifecycle "started"
  # markers and retry backoff waits (the completion record and retry_attempt
  # already carry the useful information), plus any DEBUG records.
  # The harness mirrors this by emitting these at DEBUG, but the filter is a
  # policy net for any app that emits them at INFO.
  filter/drop_noise:
    error_mode: ignore
    logs:
      log_record:
        - severity_number == SEVERITY_NUMBER_DEBUG
        - IsMatch(body.string, ".*_started$")
        - body.string == "retry_wait"
  batch:

exporters:
  otlp_http/langfuse:
    endpoint: ${env:LANGFUSE_HOST}/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH}"
      x-langfuse-ingestion-version: "4"
  otlp_http/elasticsearch:
    endpoint: http://elasticsearch:9200/_otlp
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/langfuse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [filter/drop_noise, batch]
      exporters: [otlp_http/elasticsearch]
