# Elasticsearch + Jaeger + Prometheus pushgateway for agent_harness observability.
# Start all:    docker compose up -d
# Start one:    docker compose up -d elasticsearch
# Stop all:     docker compose down -v

services:
  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: agent-harness-elastic
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: agent-harness-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "6831:6831/udp"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: "9411"

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: agent-harness-pushgateway
    ports:
      - "9091:9091"

volumes:
  es_data:
