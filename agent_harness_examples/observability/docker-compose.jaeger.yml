# Jaeger all-in-one for OTELTracer and JaegerTracer.
# Start: docker compose -f docker-compose.jaeger.yml up -d
# Stop:  docker compose -f docker-compose.jaeger.yml down -v
#
# Ports:
#   16686 - Jaeger UI    → http://localhost:16686
#   4317  - OTLP gRPC    → OTELTracer(otlp_endpoint="http://localhost:4317")
#   6831  - Thrift UDP   → JaegerTracer(jaeger_host="localhost", jaeger_port=6831)

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: agent-harness-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "6831:6831/udp" # Jaeger Thrift (UDP)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: "9411"

volumes: {}
