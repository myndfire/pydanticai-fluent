[project]
name = "agent-harness-examples"
version = "0.1.0"
description = "Examples for the pydanticai-fluent package"
requires-python = ">=3.11"
dependencies = [
    "pydanticai-fluent @ git+https://github.com/myndfire/pydanticai-fluent.git@main",
    "pydantic-ai",
    "beanie",
    "colorama"
]

[project.urls]
Repository = "https://github.com/myndfire/pydanticai-fluent"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = []

[tool.uv.sources]
pydanticai-fluent = { git = "https://github.com/myndfire/pydanticai-fluent.git", branch = "main" }