# MongoDB for MongoPrompts provider.
# Start: docker compose -f docker-compose.mongo.yml up -d
# Stop:  docker compose -f docker-compose.mongo.yml down -v

services:
  mongo:
    image: mongo:7
    container_name: agent-harness-prompts-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: agent_prompts
    volumes:
      - mongo_prompts_data:/data/db

volumes:
  mongo_prompts_data:
