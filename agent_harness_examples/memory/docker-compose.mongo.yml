# MongoDB for MongoMemory provider.
# Start: docker compose -f docker-compose.mongo.yml up -d
# Stop:  docker compose -f docker-compose.mongo.yml down -v

services:
  mongo:
    image: mongo:7
    container_name: agent-harness-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: agent_memory
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
