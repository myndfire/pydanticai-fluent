apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: elasticsearch
        tags: [trace_id, span_id]
        mapTagNamesEnabled: true
        filterByTraceID: true
