[project]
name = "agent-harness"
version = "0.1.0"
description = "Managed Agent framework with fluent API"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "pydanticai-fluent contributors" },
]
keywords = ["ai", "llm", "agent", "pydantic-ai", "fluent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai==2.33.0",
    "python-dotenv==1.2.2",
    "structlog==26.1.0",
    "jinja2==3.1.6",
    "pydantic-settings==2.14.2",
    "aio-pika==10.0.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
]

[project.urls]
Repository = "https://github.com/myndfire/pydanticai-fluent"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_harness*"]

